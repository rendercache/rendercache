# Complete local example. Terminate production TLS before this listener, or add
# your certificate/server_name. RenderCache and its admin port stay private.
worker_processes 1;
pid /tmp/rendercache-nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/rendercache-nginx-body;
    proxy_temp_path /tmp/rendercache-nginx-proxy;
    client_max_body_size 16m;
    map $http_user_agent $rendercache_upstream {
        default app_origin;
        ~*(Googlebot|bingbot|DuckDuckBot|OAI-SearchBot|GPTBot|ChatGPT-User|ClaudeBot|Claude-SearchBot|Claude-User|PerplexityBot|Perplexity-User|Meta-ExternalAgent|Bytespider|Applebot|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot) rendercache_backend;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    upstream app_origin { server 127.0.0.1:8081; }
    upstream rendercache_backend { server 127.0.0.1:8080; }
    server {
        listen 127.0.0.1:8088;
        server_name app.example.com;
        location / {
            proxy_pass http://$rendercache_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-RenderCache-Edge-Key "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }
    }
}
