name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test -z "$(gofmt -l cmd internal examples)"
      - run: go vet ./...
      - name: Locate Chrome for real rendering tests
        shell: bash
        run: |
          chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome_path"
          echo "RENDERCACHE_TEST_CHROME=$chrome_path" >> "$GITHUB_ENV"
      - run: go test -race ./...
        env:
          RENDERCACHE_TEST_NO_SANDBOX: '1'
      - run: node --test deploy/cloudflare/worker.test.mjs
      - run: go build -o bin/rendercache ./cmd/rendercache
      - name: Install nginx and test shipped routing against the real binary
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          python3 scripts/smoke.py --binary bin/rendercache --chrome "$RENDERCACHE_TEST_CHROME" --nginx /usr/sbin/nginx
        env:
          RENDERCACHE_TEST_NO_SANDBOX: '1'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root runtime with Chromium
        run: docker build --build-arg COMMIT="$GITHUB_SHA" -t rendercache:test .
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          RENDERCACHE_ADMIN_TOKEN: ci-validation-token
      - name: Isolated real-Chromium container smoke
        run: python3 scripts/container-smoke.py
  artifacts:
    needs: [test, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Build twice and compare deterministic archives
        run: |
          bash scripts/build-release.sh dist
          bash scripts/build-release.sh dist-repeat
          cmp dist/SHA256SUMS dist-repeat/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
      - name: Verify archive executable with real browser
        shell: bash
        run: |
          mkdir -p binary-smoke
          tar -xzf dist/rendercache_*_linux_amd64.tar.gz -C binary-smoke
          binary-smoke/rendercache version
          chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          python3 scripts/smoke.py --binary binary-smoke/rendercache --chrome "$chrome_path"
        env:
          RENDERCACHE_TEST_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-release
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [test, container, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-release
          path: dist
      - name: Publish verified alpha assets and matching source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --prerelease --title "RenderCache v$version" --notes-file docs/release-notes.md
