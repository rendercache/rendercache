name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd internal examples)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/rendercache ./cmd/rendercache
