name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal examples)"
      - run: go vet ./...
      - name: Locate Chrome for real rendering tests
        run: |
          case "$RUNNER_OS" in
            Linux) chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser) ;;
            macOS) chrome_path="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
            Windows) chrome_path="C:/Program Files/Google/Chrome/Application/chrome.exe" ;;
          esac
          test -n "$chrome_path" && test -e "$chrome_path"
          echo "RENDERCACHE_TEST_CHROME=$chrome_path" >> "$GITHUB_ENV"
          # The Linux runner cannot use Chrome's sandbox; macOS and Windows keep it on.
          if [ "$RUNNER_OS" = Linux ]; then echo "RENDERCACHE_TEST_NO_SANDBOX=1" >> "$GITHUB_ENV"; fi
          if [ "$RUNNER_OS" = Windows ]; then echo "PYTHON=python" >> "$GITHUB_ENV"; else echo "PYTHON=python3" >> "$GITHUB_ENV"; fi
      - name: Run and record go test -race ./...
        run: |
          "$PYTHON" scripts/record-tests.py --annotate
      - if: runner.os == 'Linux'
        run: node --test deploy/cloudflare/worker.test.mjs
      - name: Build and smoke-test the executable with real Chrome
        run: |
          binary=bin/rendercache
          [ "$RUNNER_OS" = Windows ] && binary=bin/rendercache.exe
          go build -o "$binary" ./cmd/rendercache
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y nginx
            "$PYTHON" scripts/smoke.py --binary "$binary" --chrome "$RENDERCACHE_TEST_CHROME" --nginx /usr/sbin/nginx
          else
            "$PYTHON" scripts/smoke.py --binary "$binary" --chrome "$RENDERCACHE_TEST_CHROME"
          fi
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root runtime with Chromium
        run: docker build --build-arg COMMIT="$GITHUB_SHA" -t rendercache:test .
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          RENDERCACHE_ADMIN_TOKEN: ci-validation-token
      - name: Isolated real-Chromium container smoke
        run: python3 scripts/container-smoke.py
  artifacts:
    needs: [test, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Build twice and compare deterministic archives
        run: |
          for target in "linux amd64" "darwin arm64" "windows amd64"; do
            bash scripts/build-release.sh dist $target
            bash scripts/build-release.sh dist-repeat $target
          done
          cmp dist/SHA256SUMS dist-repeat/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
      - name: Verify the Linux archive executable with real Chrome
        run: |
          mkdir -p binary-smoke
          tar -xzf dist/rendercache_linux_amd64.tar.gz -C binary-smoke
          binary-smoke/rendercache version
          chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          python3 scripts/smoke.py --binary binary-smoke/rendercache --chrome "$chrome_path"
        env:
          RENDERCACHE_TEST_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
